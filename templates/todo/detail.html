{% extends "base.html" %}

{% block content %}

    <div class="todoDetail">

    </div>

    <div class="btnList">
        <button class="todoUpdate" onclick="toUpdate()">수정</button>
        <button class="todoDelete" onclick="toDelete()">삭제</button>
        <button class="todoList" onclick="toList()">목록</button>
    </div>


<script>
    $(document).ready(function(){
        pk = window.location.href.split('/').filter(Boolean).pop()
        axiosInstance.get(`/api/todo/viewsets/${pk}/`)
        .then(
            function(response){
                todo = response.data
                $(".todoDetail").append(`
                    <div class="todo-item">
                        <p><strong>Name: </strong> ${ todo.name } </p>
                        <p><strong>Description: </strong> ${ todo.description } </p>
                        <p><strong>Complete: </strong> ${ completeOrNot(todo.complete) } </p>
                        <p><strong>Completed At: </strong> ${ datetimeToString(todo.completed_at) } </p>
                        <p><strong>Experience Points: </strong> ${ todo.exp } </p>
                    </div>
                `)
            }
        )
        .catch(
            function(error){
                console.log(error);
                // alert("삭제된 todo입니다.");
                // window.location.href = "/todo/list/";
            }
        )
    })

    function toUpdate(){
        pk = window.location.href.split('/').filter(Boolean).pop();
        window.location.href = `/todo/update/${pk}/`;
    }

    function toDelete(){
        pk = window.location.href.split('/').filter(Boolean).pop();
        if (confirm("정말 Todo를 삭제하시겠습니까?")) {
            axiosInstance.delete(`/api/todo/viewsets/${pk}/`)
            .then(function(response){
                alert("삭제되었습니다.");
                window.location.href = "/todo/list/";
            })
            .catch(function(error){
                alert("Todo 삭제에 실패했습니다.")
            })
        }
    }

    function toList(){
        window.location.href = '/todo/list';
    }
</script>

{% endblock %}
