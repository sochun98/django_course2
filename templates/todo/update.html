{% extends "base.html" %}

{% block content %}

    <h1>Todo Update</h1>

    <div class="container">
        <h2>Update Your Todo</h2>
            <div>
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required maxlength="100">
            </div>
            <div>
                <label for="description">설명:</label>
                <textarea id="description" name="description"></textarea>
            </div>
            <div>
                <label for="complete">완료 여부:</label>
                <input type="checkbox" id="complete" name="complete">
            </div>
            <div>
                <label for="exp">경험 점수:</label>
                <input type="number" id="exp" name="exp" min="0" value="0">
            </div>
            <button type="submit" id="todoUpdate" class="todoUpdate">Update</button>
    </div>


    <script>
        // 페이지 로드시 값을 넣어준다.
        $(document).ready(function(){
            let pk = window.location.href.split('/').filter(Boolean).pop()
            axiosInstance.get(`/api/todo/viewsets/${pk}/`)
            .then(
                function(response){
                    todo = response.data;
                    $("#name").val(todo.name);
                    $("#description").val(todo.description);
                    $("#complete").prop("checked", todo.complete);
                    $("#exp").val(todo.exp);
                }
            )
        })


        // 버튼이 클릭된다면
        $("#todoUpdate").on("click", function(){
            let pk = window.location.href.split('/').filter(Boolean).pop()
            axiosInstance.patch(`/api/todo/viewsets/${pk}/`, {
                name: $("#name").val(),
                description: $("#description").val(),
                complete: $("#complete").prop("checked"),
                exp: $("#exp").val(),
            })
            .then(function(response){
                window.location.href = `/todo/${pk}/`;
            })
            .catch(function(error){
                console.log(error)
                alert("Todo 수정 실패");
            })
        })
    </script>

{% endblock %}
