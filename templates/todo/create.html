{% extends "base.html" %}

{% block content %}

    <h1>Todo Create</h1>

    <div class="container">
        <h2>Create a New Todo</h2>
            <div>
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required maxlength="100">
            </div>
            <div>
                <label for="description">설명:</label>
                <textarea id="description" name="description"></textarea>
            </div>
            <div>
                <label for="complete">완료 여부:</label>
                <input type="checkbox" id="complete" name="complete">
            </div>
            <div>
                <label for="exp">경험 점수:</label>
                <input type="number" id="exp" name="exp" min="0" value="0">
            </div>
            <button type="submit" id="todoCreate">Create</button>
    </div>


    <script>
        $("#todoCreate").on("click", function(){
            axiosInstance.post("/api/todo/create/", {
                name: $("#name").val(),
                description: $("#description").val(),
                complete: $("#complete").val() === 'on',
                exp: $("#exp").val(),
            })
            .then(function(response){
                window.location.href = "/todo/list/";
            })
            .catch(function(error){
                console.log(error)
                alert("Todo 생성 실패");
            })
        })
    </script>

{% endblock %}
